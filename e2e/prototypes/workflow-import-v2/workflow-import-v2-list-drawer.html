<!doctype html>
<!--
  Three variants of the 工作流（Workflow） import flow, switchable via ?variant=A|B|C.
  THESIS: import is creation, not identity replacement; refuse a hidden editor-only import affordance.
  OWN-WORLD: existing Uni-Lab light workbench, compact controls, blue workflow accent, flat bordered surfaces.
  STORY: scan saved workflows, import a file, understand validation and identity behavior, then create and open.
  FIRST VIEWPORT: real shell and catalog remain visible; the recommended right drawer owns the action and diagnostics.
  FORM: ranked first, catalog plus non-blocking inspection drawer; staging seed not applicable to this local extension.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Uni-Lab 工作流导入交互稿</title>
  <style>
    :root{--bg:#f4f7fb;--canvas:#f1f5fa;--surface:#fff;--subtle:#f8fafd;--muted:#edf2f7;--border:#dde5ee;--border-strong:#c9d4e1;--text:#1f2329;--text-2:#5f6978;--text-3:#59677a;--blue:#2563eb;--blue-hover:#1d4ed8;--blue-soft:#eff6ff;--green:#15803d;--green-soft:#f0fdf4;--orange:#c2410c;--orange-soft:#fff7ed;--red:#b91c1c;--red-soft:#fef2f2;--shadow:0 16px 40px rgba(15,23,42,.14);--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px}.app{display:flex;height:100%;flex-direction:column}.topbar{display:flex;height:48px;flex:none;align-items:center;border-bottom:1px solid var(--border);background:var(--surface);padding:0 16px}.brand{font-weight:650;letter-spacing:-.01em}.connection{display:flex;align-items:center;gap:8px;margin-left:auto;border:1px solid #a7e8bd;border-radius:7px;background:#f2fff6;padding:4px 7px}.connection strong{display:flex;align-items:center;gap:6px;color:#12833b;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#18a34a}.select,.url{height:30px;border:1px solid var(--border-strong);border-radius:5px;background:white;color:#303947;font:12px var(--font)}.select{min-width:175px;padding:0 28px 0 10px}.url{width:190px;padding:0 10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.user{display:flex;height:32px;align-items:center;gap:7px;margin-left:12px;border:1px solid var(--border);border-radius:6px;background:#fff;padding:0 11px;color:#475569;font-size:12px}.shell{display:flex;min-height:0;flex:1}.nav{display:flex;width:72px;flex:none;flex-direction:column;border-right:1px solid var(--border);background:var(--subtle);padding-top:8px}.nav-item{display:flex;height:62px;align-items:center;justify-content:center;flex-direction:column;gap:4px;border:0;border-left:3px solid transparent;background:transparent;color:#59677a;font:11px var(--font)}.nav-item svg{width:18px;height:18px}.nav-item.active{border-left-color:var(--blue);background:#eef5ff;color:var(--blue)}.main{position:relative;min-width:0;flex:1;background:var(--canvas)}.catalog{display:flex;height:100%;min-width:0;flex-direction:column}.catalog-head{display:flex;min-height:88px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--surface);padding:18px 28px}.title h1{margin:0;font-size:18px;line-height:26px}.title p{margin:3px 0 0;color:var(--text-2);font-size:12px}.actions{display:flex;align-items:center;gap:10px}.button{display:inline-flex;height:36px;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border-strong);border-radius:6px;background:#fff;padding:0 13px;color:#334155;font:13px var(--font);white-space:nowrap}.button svg{width:15px;height:15px}.button.primary{border-color:var(--blue);background:var(--blue);color:#fff}.button.primary:hover{background:var(--blue-hover)}.button.ghost{border-color:transparent;background:transparent}.button[disabled]{border-color:#dfe5ec;background:#eef2f6;color:#97a3b3}.body{min-height:0;flex:1;overflow:auto;padding:20px 28px}.summary{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:var(--text-2);font-size:12px}.summary strong{color:var(--text);font-weight:600}.filters{display:flex;gap:8px}.filter{height:28px;border:1px solid transparent;border-radius:5px;background:transparent;padding:0 9px;color:#667085;font:12px var(--font)}.filter.active{border-color:var(--border);background:#fff;color:var(--blue)}.workflow-list{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:12px}.workflow-card{position:relative;display:flex;min-width:0;min-height:112px;gap:12px;border:1px solid var(--border);border-radius:10px;background:#fff;padding:15px;box-shadow:0 1px 3px rgba(15,23,42,.07)}.workflow-card:hover{border-color:#93b4ed}.workflow-icon{display:grid;width:36px;height:36px;flex:none;place-items:center;border-radius:8px;background:var(--blue-soft);color:var(--blue)}.workflow-icon svg{width:19px;height:19px}.workflow-info{min-width:0;flex:1}.workflow-name{overflow:hidden;margin:1px 0 7px;font-weight:650;text-overflow:ellipsis;white-space:nowrap}.meta{display:flex;align-items:center;gap:7px;color:var(--text-2);font-size:11px}.sep{width:2px;height:2px;border-radius:50%;background:#9aa7b7}.tag{display:inline-flex;height:22px;align-items:center;border-radius:4px;padding:0 7px;font-size:11px;font-weight:550}.tag.applied{background:var(--green-soft);color:var(--green)}.tag.pending{background:var(--orange-soft);color:var(--orange)}.tag.repair{background:var(--red-soft);color:var(--red)}.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;color:var(--text-3);font-size:11px}.arrow{color:#7791b8}.drawer-shade{display:none}.drawer{position:absolute;top:0;right:0;display:flex;width:470px;height:100%;flex-direction:column;border-left:1px solid var(--border-strong);background:#fff;box-shadow:-16px 0 36px rgba(15,23,42,.12)}.drawer-head{display:flex;height:68px;flex:none;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding:0 24px}.drawer-head h2{margin:0;font-size:17px}.icon-button{display:grid;width:32px;height:32px;place-items:center;border:0;border-radius:5px;background:transparent;color:#5d6877}.icon-button svg{width:18px;height:18px}.drawer-body{min-height:0;flex:1;overflow:auto;padding:22px 24px 28px}.section{margin-top:24px}.section:first-child{margin-top:0}.section h3{margin:0 0 10px;font-size:13px}.file{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:8px;background:var(--subtle);padding:12px}.file-mark{display:grid;width:34px;height:38px;place-items:center;border-radius:6px;background:#fff;color:var(--blue);box-shadow:0 1px 2px rgba(15,23,42,.1)}.file-mark svg{width:18px}.file-main{min-width:0;flex:1}.file-main strong{display:block;overflow:hidden;font-size:12px;text-overflow:ellipsis;white-space:nowrap}.file-main span{display:block;margin-top:4px;color:var(--text-2);font-size:11px}.file-type{border:1px solid #bfdbfe;border-radius:4px;background:var(--blue-soft);padding:3px 6px;color:#1d4ed8;font-size:10px}.field label{display:block;margin-bottom:7px;color:#465264;font-size:12px;font-weight:600}.input{width:100%;height:38px;border:1px solid var(--border-strong);border-radius:6px;padding:0 11px;color:var(--text);font:13px var(--font);outline:none}.input:focus{border-color:#6091eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{border:1px solid var(--border);border-radius:7px;background:#fff;padding:10px 12px}.stat strong{display:block;font-size:16px}.stat span{display:block;margin-top:3px;color:var(--text-2);font-size:11px}.check-panel{border:1px solid #b9e4c6;border-radius:8px;background:var(--green-soft);padding:13px}.check-title{display:flex;align-items:center;gap:8px;color:#116b31;font-size:12px;font-weight:650}.check-title svg{width:17px}.checks{display:grid;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid #ccebd5}.check{display:flex;align-items:center;gap:8px;color:#376148;font-size:11px}.check svg{width:14px;color:#16813c}.identity-note{display:flex;gap:9px;border-radius:7px;background:#f1f5f9;padding:11px;color:#4b5869;font-size:11px;line-height:1.55}.identity-note svg{width:16px;flex:none;color:#64748b}.drawer-foot{display:flex;height:64px;flex:none;align-items:center;justify-content:flex-end;gap:9px;border-top:1px solid var(--border);padding:0 24px}.prototype-badge{position:absolute;top:8px;left:50%;z-index:8;transform:translateX(-50%);border:1px solid #cbd5e1;border-radius:999px;background:rgba(255,255,255,.96);padding:5px 10px;color:#637083;font-size:10px;box-shadow:0 3px 12px rgba(15,23,42,.08)}
    .modal-overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(28,37,51,.28)}.modal{width:590px;border:1px solid var(--border-strong);border-radius:12px;background:#fff;box-shadow:var(--shadow)}.modal .drawer-head{height:64px}.modal .drawer-body{padding:20px 24px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.dropzone{display:flex;min-height:220px;align-items:center;justify-content:center;flex-direction:column;border:1px dashed #94add0;border-radius:8px;background:#f7faff;color:#48617f;text-align:center}.dropzone svg{width:34px;height:34px;margin-bottom:12px;color:var(--blue)}.dropzone strong{font-size:13px}.dropzone span{margin-top:6px;color:#78869a;font-size:11px}.modal .drawer-foot{height:60px;border-radius:0 0 12px 12px}.workspace-import{display:grid;min-height:0;flex:1;grid-template-columns:260px minmax(0,1fr);gap:0}.stepper{border-right:1px solid var(--border);background:#fff;padding:24px 20px}.step-title{margin-bottom:18px;font-weight:650}.step{display:flex;gap:10px;margin:0 0 20px;color:#677386;font-size:12px}.step-index{display:grid;width:24px;height:24px;flex:none;place-items:center;border:1px solid var(--border-strong);border-radius:50%;background:#fff;font-size:11px}.step.active{color:var(--blue);font-weight:600}.step.active .step-index{border-color:var(--blue);background:var(--blue);color:#fff}.step.done .step-index{border-color:#70c68a;background:var(--green-soft);color:var(--green)}.import-stage{overflow:auto;padding:26px 34px}.stage-panel{max-width:720px}.stage-panel h2{margin:0;font-size:18px}.stage-panel>p{margin:5px 0 20px;color:var(--text-2);font-size:12px}.wide-dropzone{min-height:150px}.compare{margin-top:16px;border:1px solid var(--border);border-radius:8px;background:#fff}.compare-row{display:grid;grid-template-columns:140px 1fr;min-height:42px;align-items:center;border-bottom:1px solid var(--border);padding:0 14px;font-size:12px}.compare-row:last-child{border-bottom:0}.compare-row span:first-child{color:var(--text-2)}.stage-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.switcher{position:fixed;bottom:18px;left:50%;z-index:20;display:flex;align-items:center;gap:4px;transform:translateX(-50%);border-radius:999px;background:#172033;padding:5px;box-shadow:0 8px 24px rgba(15,23,42,.28);color:#fff}.switcher button{display:grid;width:30px;height:30px;place-items:center;border:0;border-radius:50%;background:transparent;color:#fff;font-size:16px}.switcher button:hover{background:#2c374c}.switcher-label{min-width:172px;text-align:center;font-size:11px}.variant{display:none;height:100%}.variant.active{display:block}
    @media(max-width:980px){.workflow-list{grid-template-columns:repeat(2,minmax(230px,1fr))}.drawer{width:430px}.connection .url{display:none}.prototype-badge{top:auto;bottom:12px;left:12px;transform:none}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar"><div class="brand">Uni-Lab 调试台</div><div class="connection"><strong><i class="dot"></i>Edge 已连接</strong><select class="select" aria-label="运行环境"><option>本地 Python OS</option></select><input class="url" value="http://127.0.0.1:8015" aria-label="服务地址" /></div><button class="user"><svg viewBox="0 0 24 24" width="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>已登录用户⌄</button></header>
    <div class="shell">
      <nav class="nav" aria-label="主导航">
        <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h3M8 16h8"/></svg>仪器设备</button>
        <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v14H4zM4 9h16M9 9v10"/></svg>设备卡片</button>
        <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 7 4-7 4-7-4 7-4Z"/><path d="m5 7v8l7 4 7-4V7"/></svg>物料</button>
        <button class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M8 6h8M7 8l4 8m6-8-4 8"/></svg>工作流</button>
      </nav>
      <main class="main">
        <div class="prototype-badge">候选交互稿 · 不代表已实现</div>
        <section id="variant-a" class="variant active"></section>
        <section id="variant-b" class="variant"></section>
        <section id="variant-c" class="variant"></section>
      </main>
    </div>
  </div>
  <div class="switcher" aria-label="原型方案切换"><button id="prev" aria-label="上一方案">←</button><div id="variant-label" class="switcher-label">A — 列表右侧预检抽屉</div><button id="next" aria-label="下一方案">→</button></div>
  <script>
    const icon={plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 15v4h14v-4"/></svg>',workflow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 8 9-8 9-8-9 8-9Z"/></svg>',close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>',check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"/></svg>',info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg>',file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 13h6m-6 4h6"/></svg>'};
    const workflows=[['S04 机械臂与磁搅联调','已应用','applied','修订 2','昨天 16:42'],['S06 机械臂与加液联调','待应用','pending','修订 1','今天 09:28'],['S07 物料称量与转移','需修复','repair','修订 1','今天 10:11'],['反应釜升温与取样','已应用','applied','修订 4','8 月 5 日 18:06'],['泵送标定流程','已应用','applied','修订 3','8 月 5 日 14:20']];
    function cards(){return workflows.map(w=>`<article class="workflow-card"><div class="workflow-icon">${icon.workflow}</div><div class="workflow-info"><div class="workflow-name" title="${w[0]}">${w[0]}</div><div class="meta"><span class="tag ${w[2]}">${w[1]}</span><i class="sep"></i><span>${w[3]}</span></div><div class="card-foot"><span>更新于 ${w[4]}</span><span class="arrow">→</span></div></div></article>`).join('')}
    function header(){return `<header class="catalog-head"><div class="title"><h1>工作流</h1><p>创建、导入并管理保存在当前 OS 中的工作流</p></div><div class="actions"><button class="button">${icon.upload}导入工作流</button><button class="button primary">${icon.plus}新建工作流</button></div></header>`}
    function catalog(){return `<div class="catalog">${header()}<div class="body"><div class="summary"><span>共 <strong>5</strong> 个工作流</span><div class="filters"><button class="filter active">全部</button><button class="filter">已应用</button><button class="filter">待处理</button></div></div><div class="workflow-list">${cards()}</div></div></div>`}
    function diagnostics(){return `<div class="check-panel"><div class="check-title">${icon.check}检查通过，可创建新的工作流</div><div class="checks"><div class="check">${icon.check}Python 语法与工作流定义有效</div><div class="check">${icon.check}3 个动作模板均可用</div><div class="check">${icon.check}节点与连接关系完整</div></div></div>`}
    function importDetails(){return `<div class="section"><h3>导入文件</h3><div class="file"><div class="file-mark">${icon.file}</div><div class="file-main"><strong>s06_robot_workflow.py</strong><span>4.8 KB · 已读取</span></div><span class="file-type">Python</span></div></div><div class="section field"><label for="name">新工作流名称</label><input id="name" class="input" value="S06 机械臂与加液联调（副本）" /></div><div class="section stats"><div class="stat"><strong>3</strong><span>节点</span></div><div class="stat"><strong>2</strong><span>连接</span></div></div><div class="section">${diagnostics()}</div><div class="section identity-note">${icon.info}<span>导入会创建一个新的工作流。系统会为它重新分配标识，不会覆盖列表中的现有工作流。</span></div>`}
    document.getElementById('variant-a').innerHTML=`${catalog()}<div class="drawer-shade"></div><aside class="drawer" aria-label="导入工作流"><header class="drawer-head"><h2>导入工作流</h2><button class="icon-button" aria-label="关闭">${icon.close}</button></header><div class="drawer-body">${importDetails()}</div><footer class="drawer-foot"><button class="button">取消</button><button class="button primary">创建并打开</button></footer></aside>`;
    document.getElementById('variant-b').innerHTML=`${catalog()}<div class="modal-overlay"><section class="modal"><header class="drawer-head"><h2>导入工作流</h2><button class="icon-button">${icon.close}</button></header><div class="drawer-body"><div class="modal-grid"><div class="dropzone">${icon.upload}<strong>选择或拖入工作流文件</strong><span>支持 .py 与 .json 文件</span></div><div><div class="field"><label>新工作流名称</label><input class="input" value="S06 机械臂与加液联调（副本）" /></div><div class="section">${diagnostics()}</div><div class="section identity-note">${icon.info}<span>导入始终创建新的工作流，不覆盖现有内容。</span></div></div></div></div><footer class="drawer-foot"><button class="button">取消</button><button class="button primary">创建并打开</button></footer></section></div>`;
    document.getElementById('variant-c').innerHTML=`<div class="catalog">${header()}<div class="workspace-import"><aside class="stepper"><div class="step-title">导入工作流</div><div class="step done"><span class="step-index">✓</span><span>选择文件</span></div><div class="step active"><span class="step-index">2</span><span>检查与命名</span></div><div class="step"><span class="step-index">3</span><span>创建工作流</span></div></aside><div class="import-stage"><div class="stage-panel"><h2>检查导入内容</h2><p>确认工作流结构和名称，创建后可继续编辑。</p><div class="file"><div class="file-mark">${icon.file}</div><div class="file-main"><strong>s06_robot_workflow.py</strong><span>Python · 4.8 KB</span></div><button class="button ghost">重新选择</button></div><div class="section field"><label>新工作流名称</label><input class="input" value="S06 机械臂与加液联调（副本）" /></div><div class="compare"><div class="compare-row"><span>导入结果</span><strong>创建新的工作流</strong></div><div class="compare-row"><span>结构</span><strong>3 个节点 · 2 条连接</strong></div><div class="compare-row"><span>身份处理</span><strong>重新分配，不覆盖现有工作流</strong></div><div class="compare-row"><span>检查状态</span><strong style="color:var(--green)">全部通过</strong></div></div><div class="stage-actions"><button class="button">返回列表</button><button class="button primary">创建并打开</button></div></div></div></div></div>`;
    const variants=['A','B','C'];const names={A:'列表右侧预检抽屉',B:'聚焦式导入弹窗',C:'分步导入工作区'};let current=new URLSearchParams(location.search).get('variant')?.toUpperCase()||'A';if(!variants.includes(current))current='A';
    function render(){variants.forEach(v=>document.getElementById(`variant-${v.toLowerCase()}`).classList.toggle('active',v===current));document.getElementById('variant-label').textContent=`${current} — ${names[current]}`;const u=new URL(location.href);u.searchParams.set('variant',current);history.replaceState(null,'',u)}
    function cycle(delta){current=variants[(variants.indexOf(current)+delta+variants.length)%variants.length];render()}document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
  </script>
</body>
</html>
