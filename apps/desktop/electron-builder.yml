appId: org.unilab.desktop
productName: Uni-Lab
directories:
  output: release
  buildResources: build
files:
  - out/**
  - '!**/*.map'
extraResources:
  - from: ../../packages/device-card-agent-cli/dist/cli.mjs
    to: device-card-agent/cli.mjs
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - dmg
  artifactName: ${productName}-${version}-${arch}.${ext}
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
