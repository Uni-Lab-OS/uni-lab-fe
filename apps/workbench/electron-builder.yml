appId: com.bohrium.unilab
productName: UniLab Workbench
copyright: Copyright © 2026 UniLab
compression: maximum
directories:
  output: release-macos
  buildResources: ../desktop/build
files:
  - desktop/main.cjs
  - desktop/welcome.html
  - desktop/welcome.css
  - desktop/welcome.js
  - package.json
  - '!node_modules/**'
extraResources:
  - from: lib
    to: workbench/lib
    filter:
      - '**/*'
      - '!**/*.map'
  - from: plugins
    to: workbench/plugins
    filter:
      - '**/*'
      - '!**/*.map'
  - from: ../desktop/out/main
    to: desktop/out/main
    filter:
      - '**/*'
      - '!**/*.map'
  - from: ../desktop/out/preload
    to: desktop/out/preload
    filter:
      - '**/*'
      - '!**/*.map'
  - from: .packaging/desktop-runtime/node_modules
    to: desktop/node_modules
    filter:
      - '**/*'
      - '!**/*.map'
  - from: .packaging/node-runtime
    to: node-runtime
    filter:
      - '**/*'
  - from: .packaging/device-card-builder
    to: device-card-builder
  - from: ../../packages/device-card-agent-cli/dist/cli.mjs
    to: device-card-agent/cli.mjs
  - from: .packaging/runtime-installer
    to: runtime-installer
    filter:
      - '**/*'
  - from: .packaging/agent-runtime
    to: agent-runtime
    filter:
      - '**/*'
  - from: resources/workspace-skills
    to: workspace-skills
    filter:
      - '**/*'
  - from: ../desktop/resources/default-workspace
    to: default-workspace
    filter:
      - '**/*'
  - from: ../desktop/build/icon.png
    to: branding/icon.png
  - from: compatibility.json
    to: compatibility.json
  - from: .packaging/workbench-package.json
    to: workbench/package.json
npmRebuild: false
electronLanguages:
  - zh-CN
  - en-US
afterPack: ../desktop/scripts/after-pack.mjs
mac:
  category: public.app-category.developer-tools
  icon: icon.icns
  target:
    - target: dmg
      arch:
        - arm64
  artifactName: ${productName}-${version}-${arch}.${ext}
  minimumSystemVersion: '13.0'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  category: Development
  icon: icon.png
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
