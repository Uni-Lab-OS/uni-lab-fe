appId: com.bohrium.unilab
productName: UniLab Workbench
copyright: Copyright © 2026 UniLab
# electron-builder 明确说明 maximum 几乎不减小产物，却会增加构建时间。
# normal 同时用于正式包与 CI，避免性能基准和发布配置分叉。
compression: normal
directories:
  output: release-macos
  buildResources: ../desktop/build
files:
  - desktop/main.cjs
  - desktop/welcome.html
  - desktop/welcome.css
  - desktop/welcome.js
  - package.json
  - '!node_modules/**'
extraResources:
  - from: lib
    to: workbench/lib
    filter:
      - '**/*'
      - '!**/*.map'
  - from: plugins
    to: workbench/plugins
    filter:
      - '**/*'
      - '!**/*.map'
  - from: ../desktop/out/main
    to: desktop/out/main
    filter:
      - '**/*'
      - '!**/*.map'
  - from: ../desktop/out/preload
    to: desktop/out/preload
    filter:
      - '**/*'
      - '!**/*.map'
  - from: .packaging/desktop-runtime/node_modules
    to: desktop/node_modules
    filter:
      - '**/*'
      - '!**/*.map'
      - '!**/*.d.ts'
      - '!**/*.d.mts'
      - '!**/*.d.cts'
      - '!**/*.flow'
      - '!**/*.tsbuildinfo'
      # Device Card Builder uses the version-matched direct binary below.
      - '!**/.bin/esbuild*'
      - '!**/@esbuild/**'
      - '!**/esbuild/bin/**'
  # Stage the directory so the native filename is preserved on every target
  # (`node` on Linux/macOS and `node.exe` on Windows).
  - from: .packaging/node-runtime
    to: node-runtime
    filter:
      - '**/*'
  - from: .packaging/device-card-builder
    to: device-card-builder
  - from: ../../packages/device-card-agent-cli/dist/cli.mjs
    to: device-card-agent/cli.mjs
  - from: .packaging/runtime-installer
    to: runtime-installer
    filter:
      - '**/*'
  - from: .packaging/agent-runtime
    to: agent-runtime
    filter:
      - '**/*'
  - from: resources/workspace-skills
    to: workspace-skills
    filter:
      - '**/*'
  - from: ../desktop/resources/default-workspace
    to: default-workspace
    filter:
      - '**/*'
  - from: ../desktop/build/icon.png
    to: branding/icon.png
  - from: compatibility.json
    to: compatibility.json
  - from: .packaging/workbench-package.json
    to: workbench/package.json
npmRebuild: false
electronLanguages:
  - zh-CN
  - en-US
afterPack: ../desktop/scripts/after-pack.mjs
publish:
  provider: generic
  url: ${env.UNILAB_WORKBENCH_UPDATE_URL}
mac:
  category: public.app-category.developer-tools
  icon: icon.icns
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: ${productName}-${version}-${arch}.${ext}
  minimumSystemVersion: '13.0'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  # macOS 13+ supports LZFSE. It avoids maximum compression's much slower UDBZ
  # conversion while retaining a compressed, directly mountable disk image.
  format: ULFO
  # macOS updates use the ZIP blockmap referenced by latest-mac.yml.
  # Avoid scanning the large DMG and publishing metadata the updater never reads.
  writeUpdateInfo: false
linux:
  category: Development
  icon: icon.png
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # GitHub Release normalizes spaces in asset names to periods. Generate the
  # updater metadata with that safe name up front so latest.yml and the actual
  # release asset always agree.
  artifactName: UniLab.Workbench-${version}-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  # electron-updater uses blockmap for differential download and the helper
  # for per-user NSIS installations that later need elevation.
  differentialPackage: true
  packElevateHelper: true
  multiLanguageInstaller: true
  installerLanguages:
    - zh_CN
    - en_US
