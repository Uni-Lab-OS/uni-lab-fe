name: Package Windows Workbench
run-name: 生物领域包Workbench windows测试｜${{ github.ref_name }}｜${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - bug-fix-wt
    paths:
      - .github/workflows/package-windows.yml
      - apps/desktop/**
      - apps/workbench/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

concurrency:
  group: package-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  AIONUI_VERSION: 2.1.53
  UNILAB_OS_SOURCE_REF: f329e4cf3e935d985299e572c5a4a5b476321e9b
  UNILAB_RUNTIME_VERSION: 0.11.3
  UNILAB_RUNTIME_SOURCE_PACKAGE_VERSION: 0.11.3.20260819

jobs:
  package-windows-x64:
    # Node-gyp 11 does not yet recognize the Visual Studio 18 toolchain that
    # may be selected by windows-latest. Keep the native drivelist build on the
    # VS 2022 image until the dependency toolchain is upgraded.
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out Workbench
        uses: actions/checkout@v6

      - name: Check out Uni-Lab OS
        uses: actions/checkout@v6
        with:
          repository: Uni-Lab-OS/Uni-Lab-OS
          ref: ${{ env.UNILAB_OS_SOURCE_REF }}
          path: .runtime-source

      - name: Verify pinned source revisions
        run: |
          $osRevision = (git -C .runtime-source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $osRevision -ne $env:UNILAB_OS_SOURCE_REF) {
            throw "Uni-Lab OS revision mismatch: $osRevision"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.21.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Install Workbench dependencies
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install Workbench dependencies' }
          $windowsCaNative = 'node_modules/.pnpm/@vscode+windows-ca-certs@0.3.4/node_modules/@vscode/windows-ca-certs/build/Release/crypt32.node'
          if (-not (Test-Path $windowsCaNative)) {
            throw "Windows CA native module was not built: $windowsCaNative"
          }

      - name: Set up Constructor
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          use-mamba: true
          activate-environment: constructor-build
          auto-update-conda: false
          channels: conda-forge
          channel-priority: strict

      - name: Build Windows Runtime
        working-directory: .runtime-source
        run: |
          if (-not (Test-Path .conda/constructor/construct.yaml)) {
            throw 'The pinned Uni-Lab OS source does not contain its Constructor definition'
          }
          mamba install -n constructor-build --override-channels -c conda-forge constructor=3.16.1 conda-standalone=26.3.2.post1 rattler-build -y
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install Runtime build tools' }

          $recipePath = '.conda/base/recipe.yaml'
          $recipe = Get-Content $recipePath -Raw
          $publishedVersion = "  version: $env:UNILAB_RUNTIME_VERSION"
          $sourceVersion = "  version: $env:UNILAB_RUNTIME_SOURCE_PACKAGE_VERSION"
          if (-not $recipe.Contains($publishedVersion)) {
            throw "Unable to locate the Uni-Lab OS package version in $recipePath"
          }
          $recipe.Replace($publishedVersion, $sourceVersion) |
            Set-Content $recipePath -Encoding utf8NoBOM

          conda run -n constructor-build rattler-build build -r .conda/environment/recipe.yaml --target-platform win-64 -c uni-lab -c robostack-staging -c conda-forge --output-dir output
          if ($LASTEXITCODE -ne 0) { throw 'Unable to build unilabos-env' }
          conda run -n constructor-build rattler-build build -r .conda/vendor/rfc8785/recipe.yaml --target-platform win-64 -c conda-forge --output-dir output
          if ($LASTEXITCODE -ne 0) { throw 'Unable to build rfc8785' }
          conda run -n constructor-build rattler-build build -r .conda/vendor/msgcenterpy/recipe.yaml --target-platform win-64 -c conda-forge --channel ./output --output-dir output
          if ($LASTEXITCODE -ne 0) { throw 'Unable to build msgcenterpy' }
          conda run -n constructor-build rattler-build build -r .conda/vendor/pylabrobot/recipe.yaml --target-platform win-64 -c conda-forge --channel ./output --output-dir output
          if ($LASTEXITCODE -ne 0) { throw 'Unable to build pylabrobot' }
          conda run -n constructor-build rattler-build build -r .conda/base/recipe.yaml --target-platform win-64 -c uni-lab -c robostack-staging -c conda-forge --channel ./output --output-dir output
          if ($LASTEXITCODE -ne 0) { throw 'Unable to build the current Uni-Lab OS checkout' }

          $condaExe = conda run -n constructor-build python -c "import os; from pathlib import Path; print(Path(os.environ['CONDA_PREFIX'], 'standalone_conda', 'conda.exe'))"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve standalone conda.exe' }
          $condaExe = $condaExe.Trim()
          if (-not (Test-Path $condaExe)) { throw "Standalone conda.exe was not found: $condaExe" }

          $localChannel = [Uri]::new((Resolve-Path output).Path).AbsoluteUri
          $env:UNILABOS_INSTALLER_CHANNEL = $localChannel
          $env:UNILABOS_INSTALLER_PACKAGE = 'unilabos'
          $env:UNILABOS_INSTALLER_VERSION = $env:UNILAB_RUNTIME_SOURCE_PACKAGE_VERSION
          conda run -n constructor-build constructor .conda/constructor --platform win-64 --conda-exe $condaExe --output-dir dist/constructor
          if ($LASTEXITCODE -ne 0) { throw 'Constructor failed to build the Windows Runtime' }

      - name: Prepare Windows Runtime and Agent
        run: |
          $runtime = Get-ChildItem .runtime-source/dist/constructor -Filter *.exe | Select-Object -First 1
          if (-not $runtime) { throw 'Uni-Lab OS Constructor did not produce an EXE' }

          $agentInstaller = Join-Path $env:RUNNER_TEMP 'AionUi-win-x64.exe'
          $agentInstallerUrl = "https://static.aionui.com/releases/$env:AIONUI_VERSION/AionUi-$env:AIONUI_VERSION-win-x64.exe"
          Invoke-WebRequest -Uri $agentInstallerUrl -OutFile $agentInstaller

          $installerContents = Join-Path $env:RUNNER_TEMP 'aionui-installer'
          & 7z x $agentInstaller "-o$installerContents" -y
          if ($LASTEXITCODE -ne 0) { throw 'Unable to extract AionUi installer' }
          $applicationArchive = Get-ChildItem $installerContents -Recurse -Filter 'app-64.7z' | Select-Object -First 1
          if (-not $applicationArchive) { throw 'AionUi installer does not contain app-64.7z' }

          $applicationContents = Join-Path $env:RUNNER_TEMP 'aionui-application'
          & 7z x $applicationArchive.FullName "-o$applicationContents" -y
          if ($LASTEXITCODE -ne 0) { throw 'Unable to extract AionUi application' }
          $agentResources = Get-ChildItem $applicationContents -Recurse -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'app.asar') } |
            Select-Object -First 1
          if (-not $agentResources) { throw 'AionUi resources directory was not found' }

          # AionUi's packaged Windows core directory has changed names across
          # releases. Normalize the directory containing the complete native
          # payload to the name expected by UniLab instead of assuming that the
          # upstream archive already calls it windows-x64.
          $agentCore = Get-ChildItem $applicationContents -Recurse -File -Filter 'aioncore.exe' |
            Where-Object { Test-Path (Join-Path $_.Directory.FullName 'managed-resources') } |
            Select-Object -First 1
          if (-not $agentCore) {
            $coreCandidates = Get-ChildItem $applicationContents -Recurse -File -Filter 'aioncore.exe' |
              ForEach-Object { $_.FullName }
            throw "AionUi application does not contain a complete Windows core. Candidates: $($coreCandidates -join ', ')"
          }

          $normalizedCore = Join-Path $agentResources.FullName 'bundled-aioncore\windows-x64'
          $normalizedExecutable = Join-Path $normalizedCore 'aioncore.exe'
          if (-not (Test-Path $normalizedExecutable)) {
            New-Item -ItemType Directory -Path $normalizedCore -Force | Out-Null
            Get-ChildItem $agentCore.Directory.FullName -Force |
              Copy-Item -Destination $normalizedCore -Recurse -Force
          }
          if (-not (Test-Path $normalizedExecutable)) {
            throw "Unable to normalize the Windows Agent core: $normalizedExecutable"
          }

          "UNILAB_RUNTIME_INSTALLER=$($runtime.FullName)" >> $env:GITHUB_ENV
          "UNILAB_AGENT_DISTRIBUTION=$($agentResources.FullName)" >> $env:GITHUB_ENV

      - name: Build Windows x64 installer
        run: pnpm --filter @unilab/workbench package:win

      - name: Verify installer
        run: |
          $installer = Get-ChildItem apps/workbench/release-windows -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not published' }
          $stream = [System.IO.File]::OpenRead($installer.FullName)
          try { $header = @($stream.ReadByte(), $stream.ReadByte()) } finally { $stream.Dispose() }
          if ($header[0] -ne 0x4d -or $header[1] -ne 0x5a) { throw 'Installer is not a PE executable' }
          Get-FileHash $installer.FullName -Algorithm SHA256

      - name: Describe Windows test package
        run: |
          @"
          ## 生物领域包 Workbench Windows 测试

          - 源分支：`${{ github.ref_name }}`
          - FE 提交：`${{ github.sha }}`
          - Uni-Lab OS 提交：`$env:UNILAB_OS_SOURCE_REF`
          - 领域代码：不内置；用户安装后自行选择和修改外部 workspace
          - 交付位置：本次 Actions Run 的 Artifact
          - 发布限制：仅生成测试 EXE，不上传、不修改任何 stable Release
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: 生物领域包Workbench windows测试
          path: |
            apps/workbench/release-windows/*-setup.exe
            apps/workbench/release-windows/*-setup.exe.blockmap
            apps/workbench/release-windows/latest.yml
          if-no-files-found: error
          retention-days: 30
